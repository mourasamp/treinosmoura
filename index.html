<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Meus Treinos</title><meta name="description" content="Planilha e controle de treinos de corrida."><meta property="og:title" content="Meus Treinos"><meta property="og:description" content="Planilha e controle de treinos de corrida."><meta property="og:type" content="website"><meta property="og:url" content="https://mourasamp.github.io/treinosmoura/"><style id="css">
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--nav:#243650;--navd:#1a2638;--bg:#f7f8fc;--card:#fff;--tx:#1b2433;--mut:#8a93a3;--pill:#ececef;--blue:#0080e8;--tile:#2f4666}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161f;--card:#1b2433;--tx:#eef1f6;--mut:#98a2b3;--pill:#2a3445}}
:root[data-theme="dark"]{--bg:#10161f;--card:#1b2433;--tx:#eef1f6;--mut:#98a2b3;--pill:#2a3445}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
header{background:linear-gradient(var(--nav),var(--navd));color:#fff;padding:18px 18px 26px}
.logo{font-weight:800;font-size:22px;text-align:center;letter-spacing:.5px}.logo span{font-weight:300}
h1{font-size:24px;font-weight:400;margin:22px 0 0}
.back{background:none;border:0;color:#fff;font-size:15px;padding:0;margin-top:14px;cursor:pointer}
main{max-width:560px;margin:0 auto;padding:0 14px}
.card{background:var(--card);border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 1px 3px #0001}
.card h2{margin:0 0 12px;font-size:18px}
.tiles{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}
.tile{background:var(--tile);color:#fff;border:0;border-radius:12px;padding:22px 18px;font-size:18px;font-weight:700;display:flex;align-items:center;gap:14px;cursor:pointer;width:100%;text-align:left}
.ic{width:46px;height:46px;border-radius:50%;background:var(--blue);display:grid;place-items:center;font-size:22px}
.wk{font-size:22px;font-weight:700;margin:22px 0 4px}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.row b{font-size:19px}.sub{margin-top:6px}
.pill{background:var(--pill);color:var(--mut);border-radius:20px;padding:6px 14px;font-size:14px;font-weight:600;white-space:nowrap}
.pill.ok{background:#d8f3e2;color:#157a3c}
.btn{display:block;width:100%;background:var(--blue);color:#fff;border:0;border-radius:8px;padding:15px;font-size:17px;margin-top:14px;cursor:pointer}
.btn.sec{background:var(--pill);color:var(--tx)}.btn.red{background:#d64545}
.body{white-space:pre-wrap;line-height:1.6;font-size:17px}
