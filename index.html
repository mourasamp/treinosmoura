:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--nav:#243650;--navd:#1a2638;--bg:#f7f8fc;--card:#fff;--tx:#1b2433;--mut:#8a93a3;--pill:#ececef;--blue:#0080e8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161f;--card:#1b2433;--tx:#eef1f6;--mut:#98a2b3;--pill:#2a3445}}
:root[data-theme="dark"]{--bg:#10161f;--card:#1b2433;--tx:#eef1f6;--mut:#98a2b3;--pill:#2a3445}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
header{background:linear-gradient(var(--nav),var(--navd));color:#fff;padding:18px 18px 26px}
.logo{display:flex;align-items:center;justify-content:center;gap:2px;font-size:28px;line-height:1;user-select:none;-webkit-user-select:none}
.logo .mk{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#2dd4bf,#0080e8);display:grid;place-items:center;box-shadow:0 4px 14px #0080e866;transform:rotate(-8deg);margin-right:10px}
.logo .mk svg{width:23px;height:23px}
.logo .t1{font-weight:700;letter-spacing:-.5px;color:#fff}
.logo .t2{font-weight:900;font-style:italic;letter-spacing:-.5px;padding-right:3px;background:linear-gradient(90deg,#2dd4bf,#4aa8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{display:flex;align-items:center;gap:12px;font-size:30px;font-weight:800;letter-spacing:.3px;line-height:1.15;margin:22px 0 0;text-shadow:0 2px 6px #0004}
h1::before{content:"";flex:none;width:6px;height:30px;border-radius:4px;background:linear-gradient(#2dd4bf,#0080e8)}
.back{display:inline-flex;align-items:center;gap:6px;background:#141d2b;color:#fff;border:1px solid #3a4a63;border-radius:10px;font:inherit;font-size:15px;font-weight:600;padding:9px 18px;margin-top:14px;cursor:pointer;box-shadow:0 1px 3px #0004;transition:background .15s,color .15s,border-color .15s}
.back:hover,.back:active{background:#2dd4bf;border-color:#2dd4bf;color:#0b1a1f}
main{max-width:560px;margin:0 auto;padding:0 14px}
.card{background:var(--card);border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 1px 3px #0001}
.card h2{margin:0 0 12px;font-size:18px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:auto;align-items:stretch;gap:12px;margin:18px 0 24px}
.tile{appearance:none;-webkit-appearance:none;position:relative;height:auto;min-height:200px;min-width:0;overflow:hidden;background:linear-gradient(155deg,#293548 0%,#202b3b 55%,#192333 100%);color:#eef2f7;border:1px solid #354256;border-radius:15px;padding:16px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:12px;cursor:pointer;width:100%;text-align:left;font:inherit;box-shadow:0 3px 8px #0002;transition:transform .15s,filter .15s,box-shadow .15s}
.tile:hover{filter:brightness(1.07);transform:translateY(-2px);box-shadow:0 6px 14px #0003}
.tile:active{transform:scale(.98)}
.tile:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.tile-content{display:flex;flex-direction:column;gap:7px;min-width:0;width:100%}
.tile-title{font-size:18px;font-weight:800;letter-spacing:-.2px}
.tile-desc{font-size:12px;line-height:1.4;color:#aeb9c9;font-weight:500}
.tile-arrow{align-self:flex-end;margin-top:auto;font-size:18px;color:#8fa1b9;font-weight:700}
.ic{width:48px;height:48px;flex:none;border-radius:12px;background:#344b69;display:grid;place-items:center;font-size:23px}
@media(max-width:360px){.tiles{gap:9px}.tile{padding:12px;min-height:190px}.tile-title{font-size:16px}.tile-desc{font-size:11px}.ic{width:42px;height:42px}}
.wk{font-size:22px;font-weight:700;margin:22px 0 4px}
.btn{display:block;width:100%;background:var(--blue);color:#fff;border:0;border-radius:8px;padding:15px;font-size:17px;margin-top:14px;cursor:pointer}
.btn.sec{background:var(--pill);color:var(--tx)}.btn.red{background:#d64545}
.body{white-space:pre-wrap;line-height:1.65;font-size:17px}
.inline-pace{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:8px;background:#0080e822;color:var(--blue);font-size:14px;font-weight:700;vertical-align:baseline}
input,textarea{width:100%;font:inherit;font-size:16px;padding:10px;border-radius:8px;border:1px solid var(--mut);background:var(--card);color:var(--tx);margin-top:6px}
textarea{min-height:300px}
.msg{text-align:center;color:var(--mut);padding:30px 10px}
.ask{margin-top:-14px}.ask p{margin:0 0 4px;color:var(--mut)}

#dl{position:fixed;left:14px;right:14px;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:5;background:#e8a400;color:#111;border:0;border-radius:10px;padding:14px;font-size:16px;font-weight:700}
select{width:100%;font:inherit;font-size:16px;padding:10px;border-radius:8px;border:1px solid var(--mut);background:var(--card);color:var(--tx);margin-top:6px}
.mut{color:var(--mut)}.sm{font-size:13px;margin:8px 0 0}
.mine{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.chip{border-radius:12px;padding:12px;text-align:center;color:#fff;display:flex;flex-direction:column;gap:2px}
.chip b{font-size:26px}.chip small{opacity:.9;font-size:12px}
.c0{background:#2e9e5b}.c1{background:#0080e8}.c2{background:#e8870c}.c3{background:#d64545}
.pace-box{clear:both;margin-top:16px;padding:14px;border-radius:12px;background:var(--bg);border:1px solid #0002}
.pace-title{font-size:15px;font-weight:700;margin:0 0 10px}
.pace-sub{font-size:13px;color:var(--mut);margin:0 0 10px}

.pt tr.sel td{background:#4f86c6;color:#fff;font-weight:700;outline:2px solid #9cc0ea}

.note{border-left:5px solid #e8a400}

function go(h){location.hash=h}
function route(){return (location.hash||"#home").slice(1)}
function logo(){return '<div class="logo"><span class="mk"><svg viewBox="0 0 24 24"><path fill="#fff" d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg></span><span class="t1">Treinos</span><span class="t2">Moura</span></div>'}
function todayCard(){
  var t=iso(new Date()),ws=list(),w=ws.filter(function(x){return x.date===t})[0],lab="Treino de hoje";
  if(!w){w=ws.filter(function(x){return x.date>t})[0];lab="Próximo treino"}
  if(!w)return "";
  var ok=C[w.id],title=((w.body||"").split("\n")[0]||"").trim()||"Treino",d=pd(w.date);
  return '<section class="today" aria-label="'+lab+'"><div class="t-lab">'+lab+'</div><div class="t-title">'+esc(title)+'</div><div class="t-meta"><span>'+DN[d.getDay()]+' · '+dm(w.date)+'</span>'+(ok?'<span class="pill ok">Executado</span>':'')+'</div><button class="btn" data-open="'+esc(w.id)+'">'+(ok?'Ver treino':'Abrir treino')+'</button></section>';
}
function kmOf(w){var m=((w.body||"").split("\n")[0]||"").match(/(\d+(?:[.,]\d+)?)\s*km/i);return m?parseFloat(m[1].replace(",",".")):0}
function fk(n){return (Math.round(n*10)/10).toString().replace(".",",")}
function weekSummary(){
  var ws=list();if(!ws.length)return "";
  var t=iso(new Date()),ref=ws.filter(function(x){return x.date>=t})[0]||ws[ws.length-1];
  var wk=wkn(pd(ref.date)),inw=ws.filter(function(x){return wkn(pd(x.date))===wk});
  var tot=inw.length,done=inw.filter(function(x){return C[x.id]}).length,pct=Math.round(done/tot*100);
  var kt=0,kd=0;inw.forEach(function(x){var k=kmOf(x);kt+=k;if(C[x.id])kd+=k});
  var lab=(CFG.WL&&CFG.WL[wk])||("Semana "+wk);
  var msg=done===0?"Bora começar? O primeiro passo é o mais importante.":done===tot?"Semana completa. Parabéns!":"Muito bem! Continue assim.";
  return '<section class="wsum" aria-label="Resumo da semana"><div class="ws-row"><div><div class="t-lab">Resumo da semana</div><div class="ws-sub">'+esc(lab)+'</div></div><div class="ws-num"><b>'+done+'</b> de '+tot+' treinos</div></div><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><i style="width:'+pct+'%"></i></div>'+(kt?'<div class="ws-km"><span>Km rodados</span><span><b>'+fk(kd)+'</b> de '+fk(kt)+' km</span></div>':'')+'<div class="ws-msg">'+msg+'</div></section>';
}
function avisoCard(){
  var a=(CFG.AVISO||"").trim();
  if(!a&&!editor)return "";
  return '<section class="aviso" aria-label="Recado do treinador"><div class="t-lab">Recado do treinador</div>'+(a?'<p>'+esc(a)+'</p>':'<p>Nenhum recado ainda.</p>')+(editor?'<button class="ed" id="aviso-ed">✏️ '+(a?'Editar recado':'Adicionar recado')+'</button>':'')+'</section>';
}
function home(){
  var now=new Date(),h=now.getHours(),g=h<12?"Bom dia":h<18?"Boa tarde":"Boa noite";
  return '<header>'+logo()+'<h1>'+g+(NM?', '+esc(NM):'')+'!</h1>'+(NM?'<button class="back" id="rename">✏️ Mudar nome</button>':'')+'</header><main>'+
   (NM?'':'<form class="card ask" id="ask"><h2>Como você se chama?</h2><p>Seu nome fica salvo só neste aparelho.</p><input id="f-n" autocomplete="given-name" maxlength="40" placeholder="Seu nome" required><button class="btn">Salvar</button></form>')+
   todayCard()+weekSummary()+avisoCard()+
   '</main>';
}
function treinos(){
  var ws=list(),out="",last="",gridOpen=false;
  ws.forEach(function(w){
    var wk=wkn(pd(w.date));
    if(wk!==last){
      if(gridOpen)out+='</div>';
      var wl=(CFG.WL&&CFG.WL[wk])||('Semana '+wk);
      out+='<div class="wk">'+esc(wl)+(editor?' <button class="wkedit" data-wk="'+wk+'" title="Editar nome da semana">✏️</button>':'')+'</div><div class="workout-grid">';
      last=wk;gridOpen=true;
    }
    var dn=DS[(pd(w.date).getDay()+6)%7],ok=C[w.id];
    var title=String(w.body||"Treino de corrida").split(/\r?\n/)[0].replace(/^TREINO\s*/i,"").trim()||"Treino de corrida";
    out+='<button type="button" class="workout-tile'+(ok?' done':'')+'" data-open="'+esc(w.id)+'" aria-label="Abrir treino de '+esc(dn)+' '+dm(w.date)+'">'+
      '<span class="workout-top"><span class="workout-day">'+esc(dn)+'</span><span class="workout-status">'+(ok?'✓ Executado':'Pendente')+'</span></span>'+
      '<span class="workout-title">'+esc(title)+'</span>'+
      '<span class="workout-date">'+dm(w.date)+'</span>'+
      '<span class="workout-open">Toque para abrir →</span></button>';
  });
  if(gridOpen)out+='</div>';
  if(!ws.length)out='<div class="msg">Nenhum treino cadastrado ainda.</div>';
  return '<header>'+logo()+'<h1>Treinos</h1></header><main class="treinos-main">'+
    (editor?'<button class="btn" id="new">+ Novo treino</button>':'')+
    '<div class="treinos-layout">'+
    '<aside class="gym-notice"><h2><span class="gym-icon">🏋️</span>Fortalecimento</h2><p>Dias em que não houver treino de corrida, recomenda-se realizar fortalecimento na academia ou em casa. Dê atenção especial às pernas e ao core, respeitando seus limites e mantendo a recuperação como parte do planejamento.</p></aside>'+
    '<section class="treinos-list">'+out+'</section>'+
    '</div></main>';
}
var PT=[[2000,"8:00","7:10","6:30","5:30"],[2200,"7:20","6:30","5:50","5:00"],[2400,"6:45","6:00","5:20","4:40"],[2600,"6:15","5:30","4:55","4:15"],[2800,"5:45","5:10","4:35","4:00"],[3000,"5:25","4:45","4:20","3:45"],[3100,"5:15","4:40","4:10","3:35"],[3300,"4:55","4:20","3:55","3:25"],[3500,"4:40","4:05","3:40","3:10"]];
var TN=["Leve (L)","Moderado (M)","Forte (F)","Muito forte (MF)"];
var ZONE_MAP={
  MF:{code:"MF",name:"Muito forte (MF)",idx:4,cls:"c3"},
  F:{code:"F",name:"Forte (F)",idx:3,cls:"c2"},
  M:{code:"M",name:"Moderado (M)",idx:2,cls:"c1"},
  L:{code:"L",name:"Leve (L)",idx:1,cls:"c0"}
};
var ZONES=[ZONE_MAP.MF,ZONE_MAP.F,ZONE_MAP.M,ZONE_MAP.L];
function fm(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,".")}
function getTeste(){try{return +(localStorage.getItem("teste")||0)}catch(e){return 0}}
function getRowTeste(){var t=getTeste();return PT.filter(function(r){return r[0]===t})[0]||null}
function parseTokens(expr){
  var parts=String(expr||"").split("/"),list=[];
  parts.forEach(function(p){
    var k=p.trim().toUpperCase();
    if(ZONE_MAP[k]&&list.indexOf(k)===-1)list.push(k);
  });
  return list;
}
function treinoBodyHtml(body){
  var row=getRowTeste();
  var lines=String(body||"").split("\n");
  var rx=/(\b\d+(?:[.,]\d+)?\s*(?:m|km|min|minutos?)\s+(?:MF|F|M|L)(?:\s*\/\s*(?:MF|F|M|L))*|\b(?:MF|F|M|L)(?:\s*\/\s*(?:MF|F|M|L))+(?=$|[\s;,+.()-])|(?<=^|[\s;,+.()-])(?:MF|F|M|L)(?=$|[\s;,+.()-]))/gi;
  return lines.map(function(line){
    var htmlLine=esc(line);
    if(!row)return htmlLine;
    return htmlLine.replace(rx,function(match){
      var m=match.match(/(MF|F|M|L)(?:\s*\/\s*(MF|F|M|L))*$/i);
      if(!m)return match;
      var tokens=parseTokens(m[0]);
      if(!tokens.length)return match;
      var paces=tokens.map(function(tk){return row[ZONE_MAP[tk].idx]}).join(" a ");
      return match+'<span class="inline-pace">['+paces+' min/km]</span>';
    });
  }).join("\n");
}
function detectZones(body){
  var txt=String(body||""),found=[];
  ZONES.forEach(function(z){
    var re=new RegExp("(^|[^A-Za-zÁ-ú0-9])"+z.code+"(?=$|[^A-Za-zÁ-ú0-9])","g");
    if(re.test(txt))found.push(z);
  });
  return found.reverse();
}
function treinoPacesHtml(body){
  var zones=detectZones(body);
  if(!zones.length)return "";
  var row=getRowTeste();
  if(!row){
    var opts='<option value="0">Escolha seu teste de 12 min...</option>'+PT.map(function(r){return '<option value="'+r[0]+'">'+fm(r[0])+' m</option>'}).join("");
    return '<div class="pace-box"><div class="pace-title">⏱️ Seus paces neste treino</div><p class="pace-sub">Selecione a distância do seu teste de 12 minutos para ver automaticamente os ritmos de '+zones.map(function(z){return z.code}).join(", ")+'.</p><select id="quick-t">'+opts+'</select><button type="button" class="pace-link" id="go-pr">Ver tabela completa em Parâmetros</button></div>';
  }
  var note='<p class="pace-note">Estes ritmos são apenas uma base de referência, calculada a partir do seu teste de 12 minutos. Não é necessário manter exatamente esse pace durante todo o treino, ajuste conforme sua percepção de esforço, condicionamento e condições do dia.</p>';
   var items=zones.map(function(z){
    return '<div class="pace-item '+z.cls+'"><small>'+esc(z.name)+'</small><b>'+row[z.idx]+'</b><small>min/km</small></div>';
  }).join("");
  return '<div class="pace-box"><div class="pace-title">⏱️ Seus paces neste treino (base: '+fm(row[0])+' m)</div>'+note+'<div class="pace-grid">'+items+'</div><button type="button" class="pace-link" id="go-pr">Alterar distância do teste</button></div>';
}
function detail(id){
  var w=W[id];
  if(!w)return '<header>'+logo()+'<button class="back" id="bk">‹ Voltar</button></header><main><div class="msg">Treino não encontrado.</div></main>';
  var d=pd(w.date),ok=C[id];
  var head='<header>'+logo()+'<button class="back" id="bk">‹ Voltar</button><h1>'+DN[d.getDay()]+' '+dm(w.date)+'</h1></header>';
  if(editing===id)return head+'<main><div class="card"><label>Data<input type="date" id="f-d" value="'+esc(w.date)+'"></label><label>Treino<textarea id="f-b">'+esc(w.body)+'</textarea></label><button class="btn" id="save">Salvar e publicar</button><button class="btn sec" id="cancel">Cancelar</button></div></main>';
  return head+'<main><div class="card"><div class="detail-actions"><button class="done-toggle'+(ok?' is-done':'')+'" id="chk">✓ Feito</button></div><div class="body">'+treinoBodyHtml(w.body)+'</div>'+treinoPacesHtml(w.body)+
   (editor?'<button class="btn sec" id="edit">Editar</button><button class="btn red" id="del">Excluir</button>':'')+'</div></main>';
}
function pub(){
  var data=JSON.stringify({W:W,CFG:CFG}).replace(/</g,"\\u003c");
  var hd=[].map.call(document.head.querySelectorAll("meta,link,title"),function(n){return n.outerHTML}).join("");
  var doc='<!DOCTYPE html><html lang="pt-BR"><head>'+hd+'<style id="css">'+document.getElementById("css").textContent+'</style></head><body><div id="app"></div><script id="data" type="application/json">'+data+'<'+'/script><script id="appjs">'+document.getElementById("appjs").textContent+'<'+'/script></body></html>';
  var a=document.createElement("a"),url=URL.createObjectURL(new Blob([doc],{type:"text/html"}));a.href=url;a.download="index.html";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},1000);dirty=false;render();
}
function params(){
  var t=getTeste(),row=PT.filter(function(r){return r[0]===t})[0];
  var opts='<option value="0">Ainda não fiz o teste.</option>'+PT.map(function(r){return '<option value="'+r[0]+'"'+(r[0]===t?' selected':'')+'>'+fm(r[0])+' m</option>'}).join("");
  var mine='';
  if(row){mine='<div class="mine">'+TN.map(function(n,i){return '<div class="chip c'+i+'"><small>'+n+'</small><b>'+row[i+1]+'</b><small>min/km</small></div>'}).join("")+'</div>'}
  else mine='<p class="mut">Selecione acima a distância que você alcançou no teste de 12 minutos para ver seus ritmos personalizados.</p>';
  var tb='<div class="tw"><table class="pt"><thead><tr><th rowspan="2" class="dist">DISTÂNCIA</th><th colspan="4" class="hd">RITMOS (PACE) min/km</th></tr><tr><th>LEVE</th><th>MODERADO</th><th>FORTE</th><th>MUITO FORTE</th></tr></thead><tbody>'+
   PT.map(function(r,i){return '<tr class="'+(i%2?'alt':'')+(r[0]===t?' sel':'')+'"><td class="dc">'+fm(r[0])+' m</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td><td>'+r[4]+'</td></tr>'}).join("")+'</tbody></table></div><p class="mut sm">Ritmos em minutos por quilômetro (min/km).</p>';
  return '<header>'+logo()+'<h1>Parâmetros</h1></header><main>'+
  '<div class="card"><h2>Meus parâmetros</h2><label>Distância do meu teste de 12 minutos:<select id="sel-t">'+opts+'</select></label>'+mine+'</div>'+
  '<div class="card note"><b>💡 Recomendação:</b> Faça o teste de 12 minutos para obter a sua base na corrida.</div>'+
  '<div class="card"><h2>Tabela de ritmos</h2>'+tb+'</div>'+
  `<div class="card"><h2>Como ler e entender a tabela:</h2>
  <p><b>1. Coluna "DISTÂNCIA" (em verde):</b> Representa a distância máxima que você consegue correr em 12 minutos no seu esforço máximo (variando de 2.000 m a 3.500 m). Quanto maior a distância alcançada no teste, mais rápidos são os seus ritmos de treino.</p>
  <p><b>2. Colunas "RITMOS (PACE)" (em laranja):</b> Indicam o tempo médio que você deve levar para percorrer cada 1 quilômetro (min/km) de acordo com a intensidade exigida na planilha:</p>
  <ul class="lg"><li><b>LEVE (L):</b> Ritmo confortável e regenerativo, onde você consegue conversar sem ficar ofegante.</li>
  <li><b>MODERADO (M):</b> Ritmo contínuo e controlado, um pouco mais exigente, mas sustentável.</li>
  <li><b>FORTE (F):</b> Ritmo intenso, próximo ao seu limiar anaeróbico ou ritmo de prova curta (respiração bem pesada).</li>
  <li><b>MUITO FORTE (MF):</b> Esforço máximo ou próximo do máximo, usado geralmente em tiros curtos.</li></ul></div>
  <div class="card"><h2>Como aplicar na prática no seu treino:</h2>
  <p>Para usar a tabela no treino, o primeiro passo é identificar a sua linha com base no seu último teste de 12 minutos.</p>
  <p><b>Exemplo prático:</b> Suponha que no teste de 12 minutos você correu 2.800 m. Olhando na linha correspondente a <code>2.800 m</code>, seus ritmos de referência são:</p>
  <ul class="lg"><li>Leve (L): 5 min e 45 seg por km (<code>00:05:45</code>)</li><li>Moderado (M): 5 min e 10 seg por km (<code>00:05:10</code>)</li><li>Forte (F): 4 min e 35 seg por km (<code>00:04:35</code>)</li><li>Muito Forte (MF): 4 min e 00 seg por km (<code>00:04:00</code>)</li></ul>
  <p>Agora, aplicando isso diretamente ao Treino Regenerativo - 5 km:</p>
  <ol class="lg"><li><b>Aquecimento (Alongamentos Dinâmicos):</b> Faça movimentos articulares e ativação muscular antes de começar (ex.: Polichinelos, elevação de joelhos, balanço de pernas).</li>
  <li><b>Parte 1 (<code>5.000m L</code>):</b> Você vai correr 5 km contínuos no ritmo Leve (L). Usando o exemplo de quem fez 2.800 m no teste, você deve manter o relógio/aplicativo marcando perto de 5:45/km. Como o treino é regenerativo, o foco não é fazer força, e sim manter o ritmo bem controlado e solto.</li>
  <li><b>Parte 2 (<code>6x 80m F</code>, com 60s caminhando):</b> Logo após os 5 km, você fará 6 tiros de 80 metros em ritmo Forte (F).
   <ul><li><b>Dica para tiros curtos:</b> Como 80 metros é uma distância curta, o GPS do relógio demora a atualizar o pace exato (<code>00:04:35</code>). Na prática, encare esse ritmo Forte como uma aceleração firme (cerca de 80% a 85% da sua velocidade máxima), mantendo boa postura e técnica, sem dar um sprint desesperado.</li>
   <li>Após cada tiro de 80 m, caminhe por 60 segundos para baixar os batimentos antes de iniciar o próximo.</li></ul></li>
  <li><b>Volta à calma (Alongamento Muscular):</b> Finalize com alongamentos estáticos suaves para relaxar a musculatura.</li></ol></div></main>`;
}
function nav(r){
  var cur=r==="parametros"?"parametros":(r==="treinos"||r.indexOf("t-")===0)?"treinos":"home";
  var I={home:'<path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h5v-6h4v6h5V10"/>',treinos:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/>',parametros:'<circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 2M9.5 2.5h5"/>'};
  var L=[["home","Início"],["treinos","Treinos"],["parametros","Parâmetros"]];
  return '<nav class="nav" aria-label="Navegação principal">'+L.map(function(x){return '<button type="button" data-nav="'+x[0]+'" class="'+(cur===x[0]?'on':'')+'"'+(cur===x[0]?' aria-current="page"':'')+'><svg viewBox="0 0 24 24" aria-hidden="true">'+I[x[0]]+'</svg>'+x[1]+'</button>'}).join("")+'</nav>';
}
function render(){
  var r=route(),el=document.getElementById("app");
  var q=function(i){return document.getElementById(i)};
  el.innerHTML=r==="treinos"?treinos():r==="parametros"?params():r.indexOf("t-")===0?detail(r.slice(2)):home();
  el.innerHTML+=nav(r);
  [].forEach.call(el.querySelectorAll("[data-nav]"),function(b){b.onclick=function(){if(editing&&isNew)delete W[editing];editing=null;isNew=false;go(b.dataset.nav)}});
  if(q("t-tr"))q("t-tr").onclick=function(){go("treinos")};
  [].forEach.call(el.querySelectorAll("[data-wk]"),function(b){b.onclick=function(){var k=b.dataset.wk,cur=(CFG.WL&&CFG.WL[k])||("Semana "+k);var n=prompt("Nome da semana (deixe vazio para voltar ao padrão):",cur);if(n===null)return;n=n.trim().slice(0,60);CFG.WL=CFG.WL||{};if(n&&n!=="Semana "+k)CFG.WL[k]=n;else delete CFG.WL[k];dirty=true;render()}});
  if(q("t-pr"))q("t-pr").onclick=function(){go("parametros")};
  if(q("aviso-ed"))q("aviso-ed").onclick=function(){var n=prompt("Recado do treinador (deixe vazio para remover):",CFG.AVISO||"");if(n===null)return;n=n.trim().slice(0,300);if(n)CFG.AVISO=n;else delete CFG.AVISO;dirty=true;render()};
  if(q("sel-t"))q("sel-t").onchange=function(){try{localStorage.setItem("teste",this.value)}catch(e){}render()};
  if(q("quick-t"))q("quick-t").onchange=function(){try{localStorage.setItem("teste",this.value)}catch(e){}render()};
  if(q("go-pr"))q("go-pr").onclick=function(){go("parametros")};
  if(q("bk"))q("bk").onclick=function(){if(editing&&isNew)delete W[editing];editing=null;go("treinos")};
  [].forEach.call(el.querySelectorAll("[data-open]"),function(b){b.onclick=function(){go("t-"+b.dataset.open)}});
  if(q("chk"))q("chk").onclick=function(){var id=r.slice(2);C[id]=!C[id];try{localStorage.setItem("chk",JSON.stringify(C))}catch(e){}render()};
  if(q("new"))q("new").onclick=function(){var id="w"+Date.now().toString(36);W[id]={date:iso(new Date()),body:TPL};editing=id;isNew=true;go("t-"+id)};
  if(q("edit"))q("edit").onclick=function(){editing=r.slice(2);isNew=false;render()};
  if(q("cancel"))q("cancel").onclick=function(){if(isNew)delete W[editing];var wasNew=isNew;editing=null;isNew=false;if(wasNew)go("treinos");else render()};
  if(q("save"))q("save").onclick=function(){var id=editing,d=q("f-d").value;if(!d)return;W[id]={date:d,body:q("f-b").value};editing=null;isNew=false;dirty=true;render()};
  if(q("del"))q("del").onclick=function(){if(confirm("Excluir este treino?")){delete W[r.slice(2)];go("treinos");dirty=true;render()}};
  if(q("rename"))q("rename").onclick=function(){var n=prompt("Seu nome:",NM);if(n&&n.trim()){setNome(n);render()}};
  if(q("ask"))q("ask").onsubmit=function(e){e.preventDefault();var n=q("f-n").value;if(n.trim()){setNome(n);render()}};
  var lg=el.querySelector('.logo');if(lg)lg.onclick=function(){taps++;clearTimeout(tt);tt=setTimeout(function(){taps=0},1500);if(taps>=5&&!editor){taps=0;var p=prompt('PIN do treinador:');if(p===PIN){editor=true;render()}}};
  var old=document.getElementById('dl');if(old)old.remove();
  if(editor&&dirty){var b=document.createElement('button');b.id='dl';b.textContent='⬇ Baixar HTML atualizado';b.onclick=pub;document.body.appendChild(b)}
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",render);
render();
</script></body></html>
